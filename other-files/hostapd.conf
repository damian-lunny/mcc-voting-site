interface=wlan0
driver=nl80211

ssid=MCC-HotSpot
country_code=GB

# Force 2.4 GHz, widely supported
hw_mode=g
channel=6

# Disable 802.11n for old devices
ieee80211n=0

# Keep WMM on (some devices require it)
wmm_enabled=1

# Broadcast SSID
ignore_broadcast_ssid=0

# Authentication
auth_algs=1

# Enable BOTH WPA and WPA2 (max compatibility)
wpa=3
wpa_passphrase=mcchotspot123

# Allow all common encryption types
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Conservative rates for legacy devices
supported_rates=10 20 55 110
basic_rates=10 20 55 110

# Increase compatibility with older clients
macaddr_acl=0

# Avoid advanced features that cause problems
ieee80211d=0
ieee80211h=0
