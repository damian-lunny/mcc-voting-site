{% extends "base.html" %}
{% block title %}Results Archive{% endblock %}
{% block content %}

<div class="archive-page">

  <div class="weeks-list">
    <h2>Past Competitions</h2>
    <ul>
      {% for week in weeks %}
      <li>
        <a href="#" class="week-link" data-week="{{ week.label }}">{{ week.label }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>

  <div id="week-results" style="display:none;">
    <h2 id="week-title"></h2>
    <button id="close-results">Close</button>
    <div id="results-content"></div>
  </div>

</div>

{% endblock %}

{% block scripts %}
<script>

function renderAwardRow(category, type, slot, label, awards) {
    const existing = (awards?.[category]?.[type]?.[slot]) || {};

    return `
<tr class="award-row"
    data-category="${category}"
    data-type="${type}"
    data-slot="${slot}">
  <td>${label}</td>
  <td><input class="award-photo" value="${existing.photo_number || ''}"></td>
  <td><input class="award-photographer" value="${existing.photographer_name || ''}"></td>
  <td><input class="award-title" value="${existing.photo_title || ''}"></td>
  <td><button class="save-award">Save</button></td>
</tr>`;
}

function displayWeekResults(weekLabel, results, awards) {

  const div = document.getElementById('results-content');
  document.getElementById('week-title').textContent = weekLabel;

  let html = '';

  ['beginner','intermediate','advanced'].forEach(category => {

    html += `<h3>${category}</h3>`;

    if (results[category]) {

      html += `<table><tr><th>Photo</th><th>Points</th></tr>`;

      results[category].forEach(item => {
        html += `<tr>
            <td>#${item.photo_number}</td>
            <td>${item.points}</td>
        </tr>`;
      });

      html += `</table>`;
    }

    // ✅ Awards section
    html += `
<h4>Awards</h4>
<table>
<tr><th>Award</th><th>Photo</th><th>Name</th><th>Title</th><th></th></tr>
${renderAwardRow(category, 'highly_commended', 1, 'Highly Commended', awards)}
${renderAwardRow(category, 'highly_commended', 2, 'Highly Commended', awards)}
${renderAwardRow(category, 'commended', 1, 'Commended', awards)}
</table>`;
  });

  div.innerHTML = html;
  document.getElementById('week-results').style.display = 'block';
}

// ✅ Load archive
document.querySelectorAll('.week-link').forEach(link => {
  link.addEventListener('click', async e => {
    e.preventDefault();

    const week = link.dataset.week;
    const res = await fetch(`/api/archive/${encodeURIComponent(week)}`);
    const data = await res.json();

    displayWeekResults(week, data.results, data.awards || {});
  });
});

// ✅ Save awards
document.addEventListener('click', async e => {
  if (!e.target.classList.contains('save-award')) return;

  const row = e.target.closest('.award-row');

  const payload = {
    week_label: document.getElementById('week-title').textContent,
    category: row.dataset.category,
    award_type: row.dataset.type,
    slot: parseInt(row.dataset.slot),
    photo_number: row.querySelector('.award-photo').value,
    photographer_name: row.querySelector('.award-photographer').value,
    photo_title: row.querySelector('.award-title').value
  };

  await fetch('/admin/update_archive_award', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });

  alert('Saved');
});

</script>
{% endblock %}
